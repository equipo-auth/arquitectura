
services:
  db:
    image: postgres:15
    container_name: ticketu-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ticketu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: ticketu-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    # Para instalaciones nuevas. IMPORTANTE: si ya tienes realm/usuarios
    # en contenedor SIN volumen, exporta antes de recrearlo (ver GUIA).
    volumes:
      - keycloak_data:/opt/keycloak/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketu
      RABBITMQ_DEFAULT_PASS: ticketu_dev
      RABBITMQ_DEFAULT_VHOST: ticketu
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
      - plataforma-eventos-net

volumes:
  postgres_data:
  rabbitmq_data:
  keycloak_data:
    name: ticketu_keycloak_data

networks:
  plataforma-eventos-net:
    external: true
