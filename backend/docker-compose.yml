
services:
  db:
    image: postgres:15
    container_name: ticketu-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ticketu
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - plataforma-eventos-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: ticketu-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en backend/.env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Falta KEYCLOAK_CLIENT_SECRET en backend/.env}
    ports:
      - "8081:8080"
    # Para instalaciones nuevas. IMPORTANTE: si ya tienes realm/usuarios
    # en contenedor SIN volumen, exporta antes de recrearlo (ver GUIA).
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks:
      - default
      - plataforma-eventos-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketu
      RABBITMQ_DEFAULT_PASS: ticketu_dev
      RABBITMQ_DEFAULT_VHOST: ticketu
    command: >
      bash -c "
        rabbitmq-server &
        until rabbitmq-diagnostics -q ping >/dev/null 2>&1; do sleep 2; done;
        /bin/bash /etc/rabbitmq/init-auth-notifications.sh;
        wait
      "
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./tools/init-rabbitmq-auth.sh:/etc/rabbitmq/init-auth-notifications.sh:ro
    networks:
      - default
      - plataforma-eventos-net

volumes:
  postgres_data:
  rabbitmq_data:
  keycloak_data:
    name: ticketu_keycloak_data

networks:
  plataforma-eventos-net:
    external: true
