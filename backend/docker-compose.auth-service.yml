# Integración local: SOLO Auth. No define ni recrea db, keycloak o rabbitmq.
# Ejecutar después de conectar esos contenedores a plataforma-eventos-net.
# Mantener backend/.env y las llaves *.pem FUERA de la imagen Docker.
services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticketu-auth-local:4.2
    container_name: ticketu-auth-service
    env_file:
      - .env
    environment:
      # En HTTP localhost de desarrollo se mantiene secure=false en la cookie.
      # Para producción se debe usar NODE_ENV=production + HTTPS.
      NODE_ENV: development
      PORT: "10000"
      # GW1: salida del propio backend Auth hacia otro módulo SOLO vía Gateway.
      API_GATEWAY_URL: "${API_GATEWAY_URL:-http://ticketu-api-gateway:8080}"
      NOTIFICACIONES_API_PATH: "${NOTIFICACIONES_API_PATH:-/api/notificaciones}"
      NOTIFICACIONES_TIMEOUT_MS: "${NOTIFICACIONES_TIMEOUT_MS:-3000}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://admin:adminpassword@ticketu-db:5432/ticketu?schema=public}"
      KEYCLOAK_URL: "http://ticketu-keycloak:8080"
      RABBITMQ_URL: "${DOCKER_RABBITMQ_URL:-amqp://ticketu:ticketu_dev@ticketu-rabbitmq:5672/ticketu}"
    ports:
      - "10000:10000"
    volumes:
      - type: bind
        source: ./private.pem
        target: /app/private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./public.pem
        target: /app/public.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      - plataforma-eventos-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 8

  # Inicializacion OPCIONAL de esquema: solo ejecutar con `run --rm prisma-init`.
  # No se inicia automaticamente al hacer up de auth-service.
  prisma-init:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prisma-setup
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://admin:adminpassword@ticketu-db:5432/ticketu?schema=public}"
    networks:
      - plataforma-eventos-net

  # Solo se ejecuta mediante: docker compose --profile qa run --rm qa-seed
  # NO crea cuentas cuando alguien ejecuta docker compose up normal.
  qa-seed:
    profiles: ["qa"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prisma-setup
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://admin:adminpassword@ticketu-db:5432/ticketu?schema=public}"
      KEYCLOAK_URL: "http://ticketu-keycloak:8080"
      QA_AUTH_URL: "http://ticketu-auth-service:10000"
      QA_SEED_ALLOW: "${QA_SEED_ALLOW:-NO}"
      QA_SEED_RESET: "${QA_SEED_RESET:-NO}"
    command: ["node", "tools/crear-usuarios-qa.cjs"]
    networks:
      - plataforma-eventos-net

networks:
  plataforma-eventos-net:
    external: true
