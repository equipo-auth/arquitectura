openapi: 3.0.0
info:
  title: API de Autenticación - Auth Squad
  description: Servicios de autenticación y gestión de usuarios para la plataforma de eventos.
  version: 1.0.0
servers:
  - url: http://localhost:10000/api/auth
    description: Servidor de Desarrollo
paths:
  /registro:
    post:
      summary: Registrar nuevo comprador (HU-B1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, rut, email, password]
              properties:
                nombre:
                  type: string
                rut:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: Creado
        '409':
          description: Conflicto - RUT o email duplicado
  /login:
    post:
      summary: Login de Comprador / Staff (HU-B2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso, se envía cookie JWT
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Credenciales inválidas
        '429':
          description: Demasiados intentos
  /logout:
    post:
      summary: Cierre de sesión (HU-B3)
      responses:
        '200':
          description: Cookie eliminada exitosamente
  /admin/provision:
    post:
      summary: Provisión administrativa de cuentas (HU-B4)
      responses:
        '201':
          description: Cuenta de staff creada (evento enviado a Notificaciones)
  /recuperar-clave:
    post:
      summary: Solicitar token de recuperación (HU-B5)
      responses:
        '200':
          description: Solicitud recibida (evento enviado a Notificaciones)
  /identidad/{uuid}:
    get:
      summary: Consulta interna de identidad (HU-B6)
      description: Endpoint exclusivo para uso interno (ej. Catálogo). Retorna información pública del usuario.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos del usuario (rut, nombre, rol)
          content:
            application/json:
              schema:
                type: object
                properties:
                  rut:
                    type: string
                  nombre:
                    type: string
                  rol:
                    type: string
        '401':
          description: Acceso no autorizado desde red pública
        '404':
          description: Usuario no encontrado
  /.well-known/jwks.json:
    get:
      summary: Endpoint público JWKS (HU-B7)
      responses:
        '200':
          description: Retorna la llave pública vigente
